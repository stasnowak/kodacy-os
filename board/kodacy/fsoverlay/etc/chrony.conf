# KodacyOS chrony: the RG40XX V has no battery RTC, fake-hwclock restores the
# last known time at boot and chrony steps to the real one as soon as WiFi is
# up (TLS to studio.kodacy.pl needs a sane clock). Started by S49chronyd.
pool pool.ntp.org iburst
makestep 1 -1
driftfile /var/lib/chrony/drift
rtcsync
